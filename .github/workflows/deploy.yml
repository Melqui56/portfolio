name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          # Inlined into the client at build time (contact form endpoint).
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL != '' && secrets.PUBLIC_API_URL || 'https://api.mqestudios.com/api/v1' }}
          # Toggle maintenance mode without touching code: set the repo VARIABLE
          # MAINTENANCE_MODE to "true" to ship the maintenance page, "false" to go live.
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: deploy